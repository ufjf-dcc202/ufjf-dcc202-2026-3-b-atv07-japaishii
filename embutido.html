<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 CSS Embutido</title>
    <style>
        em{
            color:orange;
        }
        code{
            color:lime;
            text-decoration: underline;
            font-family:sans-serif;
        }
        body > main > dl> div:nth-child(2)>dt>code{
            color:white;
            background-color: black;
        }
        
    </style>
</head>
<body>
    <main>
        <h1>DCC202 CSS em embutido</h1>
        <p>Você pode aplicar um estilo <em >embutido</em>
         para um elemento usando o atributo 
        <code>style</code>.</p>

        <dl>
            <div>
                <dt><code>color</code></dt>
                <dd>Cor texto do elemento.</dd>
            </div>
            <div>
                <dt><code>background-color</code></dt>
                <dd>Cor de fundo do elemento.</dd>
            </div>
        </dl>
    </main>
</body>
</html>
